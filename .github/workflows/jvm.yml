name: jvm

# The JVM nodes (erupt-cloud-node, erupt-cloud-node-lite) live in the erupt repository; here only their examples and the conformance
# suite run: the lite ones against the erupt branch / tag given (develop by default), the Spring blog against the
# released erupt.
on:
  # also run by release.yml before anything is published
  workflow_call:
  workflow_dispatch:
    inputs:
      erupt-ref:
        description: branch or tag of erupts/erupt to build erupt-cloud-node-lite from
        default: develop
  push:
    paths: ["jvm/**", "schema/**", "conformance/**", ".github/workflows/jvm.yml"]
  pull_request:
    paths: ["jvm/**", "schema/**", "conformance/**", ".github/workflows/jvm.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: erupts/erupt
          ref: ${{ inputs.erupt-ref || 'develop' }}
          path: erupt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: erupt-cloud-node-lite
        working-directory: erupt
        run: mvn -B -q install -pl erupt-cloud/erupt-cloud-node-lite -am -DskipTests
      - name: Examples (Java conformance fixture, Kotlin blog)
        run: mvn -B -f jvm/examples/pom.xml package -Derupt.version="$(mvn -q -f erupt/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance
        run: python conformance/run.py -- java -jar jvm/examples/conformance/target/erupt-conformance.jar

  spring-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Spring blog against the released erupt-cloud-node-jpa
        run: mvn -B -q -f jvm/examples/spring-blog/pom.xml package
