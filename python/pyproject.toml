[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erupt-sdk"
version = "0.1.0"
description = "Serve Python models as an erupt admin UI through an erupt cloud server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.package-data]
erupt = ["*.json"]
